; XLivelessAddon

[Options]
; custom savegames folder; leave empty to use the game default (FusionFix userdata.ixx owns this when present)
CustomSavePath=
; custom settings folder; not hooked in this build, leave empty
CustomSettingsPath=
; skip the launcher/DRM checks (recovered DFA and ROM stages)
SkipLauncher=1
; remove the Rockstar Games registry path dependency
RemoveRegistryPathDependency=1
; skip the GFWL web-connect and health checks
SkipWebConnect=1
; shorten the intro screens to 300 ms (FusionFix skipintro.ixx owns this when present)
SkipIntro=1
; skip the main menu (hold SHIFT on startup to reach it) (FusionFix skipintro.ixx owns this when present)
SkipMenu=0
; keep rendering while the borderless window is unfocused (FusionFix windowed.ixx owns this when present)
DoNotPauseOnMinimize=1
; borderless window (FusionFix windowed.ixx owns this when present)
BorderlessWindowed=1
; fix the VRAM detection so the settings are not locked out (FusionFix memory.ixx owns this when present)
VRAMFix=1
; move savegames and settings to a saves folder inside the game folder (FusionFix userdata.ixx owns this when present)
LocalSettingsPath=0
