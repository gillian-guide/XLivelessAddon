name: build

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  build:
    name: Windows x86
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S . -B build/win-x86
          -G "Visual Studio 17 2022" -A Win32
          -DXLA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/win-x86 --config Release -- /m

      - name: Test
        run: ctest --test-dir build/win-x86 -C Release --output-on-failure

      - name: Package
        run: cpack --config build/win-x86/CPackConfig.cmake -C Release -B dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XLivelessAddon
          path: |
            build/win-x86/bin/XLivelessAddon.asi
            build/win-x86/bin/XLivelessAddon.map
            build/win-x86/bin/XLivelessAddon.ini
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: XLivelessAddon
          path: artifact

      - name: Attach the release zip
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifact/dist/*.zip
            artifact/dist/*.sha256
