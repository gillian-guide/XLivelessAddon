name: build

on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  build:
    name: Windows x86
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # No -G: use whichever Visual Studio generator the image provides (the
      # windows-latest image moves between VS 2022 and VS 2026). -A Win32 is the
      # part that matters, because the game and the ASI are 32-bit.
      - name: Configure
        shell: pwsh
        run: |
          cmake --version
          cmake -S . -B build/win-x86 -A Win32 -DXLA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/win-x86 --config Release -- /m

      - name: Test
        run: ctest --test-dir build/win-x86 -C Release --output-on-failure

      # The CI artifact is deliberately just the two files a user installs.
      - name: Package (ASI + INI)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Force `
            -Path build/win-x86/bin/XLivelessAddon.asi, build/win-x86/bin/XLivelessAddon.ini `
            -DestinationPath dist/XLivelessAddon.zip
          $hash = (Get-FileHash dist/XLivelessAddon.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  XLivelessAddon.zip" | Set-Content dist/XLivelessAddon.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XLivelessAddon
          path: |
            dist/XLivelessAddon.zip
            dist/XLivelessAddon.zip.sha256
          if-no-files-found: error

